<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Birbank - İlk rəqəmsal bank | Kapital bank</title>
    <link rel="icon" href="https://birbank.az/file/og_image_1080x1080_c57abea707.png">
</head>
<body>

    <header>
        <div class="card">
            <div class="card-body">
                <a href="#"><img src="img/1banklogo.svg" alt="logo"></a>
            </div>

            <div class="menubtn">
                <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight"><i class="fa-solid fa-bars"></i></button>

                <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
                    <div class="offcanvas-header">
                        <p class="offcanvas-title" id="offcanvasRightLabel">'Birbank' brendi 'Kapital Bank' ASC-nin əmtəə nişanıdır.</p>
                    </div>

                    <div class="menu">
                        <div id="menubaslig">
                            <a href="#" class="active">Fiziki</a>
                            <a href="#" class="passive">Biznes</a>
                            <a href="#" class="passive">Invest</a>
                            <a href="#" class="passive">Private</a>
                        </div>
                    </div>

                    <div id="menumain">
                        <div class="menumain"><h3>Kartlar</h3></div>
                        <div class="menumain"><h3>Kreditlər</h3></div>
                        <div class="menumain"><h3>Əmanətlər</h3></div>
                        <div class="menumain"><h3>İstiqraz</h3></div>
                        <div class="menumain"><h3>Pul köçürmələri</h3></div>
                        <div class="menumain"><h3>Partnyorlar</h3></div>
                        <div class="menumain"><h3>Kampaniyalar</h3></div>
                        <div class="menumain"><h3>Xəbərlər</h3></div>
                    </div>
                    <hr style="width: 100%; color: gray">

                    <div id="menufooter">
                        <div id="menufooter1">
                            <div id="mf1dil">
                                <p>EN</p>
                                <p>RU</p>
                            </div>

                            <div id="mf1xidmetsebekesi">
                                <a href="#"><i class="fa-solid fa-location-dot"></i>Xidmət şəbəkəsi</a>
                            </div>
                        </div>

                        <div id="menufooter2">
                            <button id="mf2btn"><i class="fa-solid fa-right-to-bracket"></i>Yüklə</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </header>

    <main></main>

    <footer></footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
